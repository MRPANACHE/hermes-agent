name: Windows venv-holder live E2E

# ON-DEMAND ONLY (fleet-update #91277, venv-holder consolidation work).
#
# Runs the live venv-holder E2E suite on a real windows-latest runner:
# spawns actual processes with realistic Hermes argv shapes and drives the
# REAL detection/classification/exemption code against the live process
# table — the coverage that cannot exist on the Linux lanes and that the
# maintainer cannot exercise locally before the work reaches main.
#
# Deliberately NOT wired to pull_request/main: it fires only on pushes to
# wine2e/** working branches, so it costs nothing on normal PRs. Delete or
# keep dormant after the venv-holder work lands.

on:
  push:
    branches:
      - 'wine2e/**'
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run. Unused by the jobs; the caller passes it for a uniform callable surface.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A workflow_call run (stable release) shares the caller's commit; its group
# includes github.run_id so a rerun of the parent gets a fresh group instead
# of cancelling this child mid-flight. wine2e push runs keep ref-scoped
# collapse as before.
concurrency:
  group: windows-venv-e2e-${{ inputs.release == true && github.run_id || github.ref }}
  cancel-in-progress: ${{ inputs.release != true }}

jobs:
  qualification-diagnostics:
    if: startsWith(github.ref, 'refs/heads/wine2e/oos-ws2-')
    name: Existing updater diagnostics (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up native ARM64 build dependencies
        if: runner.arch == 'ARM64'
        uses: ./.github/actions/setup-windows-build-deps
      - uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Read Git installation and exact git-core probes
        shell: bash
        run: |
          where.exe git
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import pm
          from hermes_cli.update_cmd_git import _probe_fork_bomb
          git = pm.installed_package('git')
          print('PM selected Git:', git, flush=True)
          roots = [Path('C:/Program Files/Git'), Path('C:/Program Files (x86)/Git')]
          if git is not None:
              roots.append(git.path)
          for root in roots:
              for arch in ('clangarm64', 'mingw64', 'mingw32'):
                  candidate = root / arch / 'libexec/git-core/git.exe'
                  print(str(candidate), 'exists=', candidate.is_file(),
                        'probe=', _probe_fork_bomb([str(candidate)]) if candidate.is_file() else None, flush=True)
          PY
      - name: Reproduce only the reported native Windows failures
        shell: bash
        env:
          HERMES_TEST_WORKERS: '1'
        run: |
          probe_exit=0
          scripts/run_tests.sh -j 1 \
            tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
            -- -m 'platforms and not integration' -s -v --durations=0 --tb=short || probe_exit=1
          scripts/run_tests.sh -j 1 \
            tests/hermes_cli/test_git_trampoline_windows_live.py -- -m 'platforms and not integration' -v --durations=10 --tb=short || probe_exit=1
          scripts/run_tests.sh -j 1 \
            tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
            -- -m 'platforms and not integration' -k test_hanging_update_help_probe_is_bounded -v --durations=10 --tb=short || probe_exit=1
          scripts/run_tests.sh -j 1 \
            tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
            -- -m 'platforms and not integration' -k 'not test_hanging_update_help_probe_is_bounded' -v --durations=12 --tb=short || probe_exit=1
          scripts/run_tests.sh -j 1 \
            tests/scripts/desktop_update/test_desktop_update_windows_handoff_lineage.py \
            tests/scripts/desktop_update/test_desktop_update_windows_marker.py \
            tests/scripts/desktop_update/test_desktop_update_windows_marker_lock.py \
            -- -m 'platforms and not integration' -v --tb=short || probe_exit=1
          exit "$probe_exit"

  venv-holder-e2e:
    if: ${{ !startsWith(github.ref, 'refs/heads/wine2e/oos-ws2-') }}
    name: venv-holder live E2E (windows-latest)
    runs-on: windows-latest-32-core
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          # The stable caller dispatches on the candidate tag; github.sha is
          # the exact candidate commit there and the head SHA everywhere else.
          ref: ${{ inputs.commit || github.sha }}

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '["messaging"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run venv-holder live E2E
        # Canonical runner (scripts/run_tests.sh) — never bare pytest: it
        # enforces credential hygiene, TZ, temp HERMES_HOME and subprocess
        # isolation. The live files are host-marked windows-only, so the
        # runner collects them on this runner instead of skipping them.
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh \
            tests/hermes_cli/test_venv_holder_windows_live.py \
            tests/hermes_cli/test_taskkill_identity_windows_live.py \
            tests/hermes_cli/test_git_trampoline_windows_live.py \
            tests/pm/test_held_entry_windows_live.py

      - name: Run Telegram CLOSE-WAIT reconnect live E2E (#87057)
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/gateway/test_telegram_closewait_windows_live.py

      - name: Run background-executor spawn parity live E2E (#70716)
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/tools/test_process_registry_windows_live.py

      - name: Turn Windows long paths off for later steps (#130242)
        # The runner image turns LongPathsEnabled on; 0 is the Windows default
        # most users have. A process reads the value when it starts, so only
        # later steps see it. Keep this step after every lane that expects the
        # image's setting. It does not depend on those lanes passing.
        id: long_paths_off
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' /v LongPathsEnabled /t REG_DWORD /d 0 /f
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled

      - name: Run PM long-path live E2E with long paths off (#130242)
        # The test first asserts RtlAreLongPathsEnabled() is false in its own
        # process, so this step cannot pass if the step above did not take.
        # ``-m`` replaces pyproject's addopts, which deselect ``integration``.
        if: ${{ !cancelled() && steps.long_paths_off.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/run_tests.sh tests/pm/test_long_paths_windows_live.py -- -m "platforms and integration" -v
